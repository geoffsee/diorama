[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
    { crate = "git2", use-instead = "gix" },
]
skip = [
    # kube-client 4.2 rustls support requires pem 3; rcgen and our PKI use pem 4.
    { name = "pem", version = "=3.0.6" },
    { name = "base64" },
    { name = "syn" },
    { name = "untrusted" },
    # kube 4.2 pulls ring, sha1, and tungstenite beside the workspace sha2 0.11 stack.
    { name = "block-buffer" },
    { name = "cpufeatures" },
    { name = "crypto-common" },
    { name = "digest" },
    { name = "getrandom" },
]
skip-tree = []

[bans.std-replacements]
scope = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The optional managed CRI adapter pins the reviewed upstream runtime revision.
allow-git = ["https://github.com/geoffsee/oci-lib"]

[licenses]
confidence-threshold = 0.93
# Empty graphs have no license hits yet. Flip this to "warn" once crates show up.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = true
