name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Revalidate after a base change; stable required check names also survive metadata edits.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker to use mirror.gcr.io mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
      - run: cargo fmt-check

  lint:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Docker to use mirror.gcr.io mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: clippy
      - name: Enforce repository language policy
        run: cargo run --locked -p diorama-dev --bin diorama-language-policy
      - name: Gate performance baselines and rebaseline policy
        run: cargo run --locked -p diorama-dev --bin diorama-perf -- gate-ci tools/perf
      - run: cargo lint

  test:
    name: Tests (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Set up Docker to use mirror.gcr.io mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: test-debug
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Test all targets
        run: cargo nextest run --locked --workspace --all-targets --all-features --profile ci
      - name: Doctests
        run: cargo test --locked --workspace --doc --all-features
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Tests
          path: target/nextest/ci/results.xml
          reporter: java-junit

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Docker to use mirror.gcr.io mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          rustup toolchain install --no-self-update
          version=$(rustc --version | cut -d ' ' -f 2)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: ${{ steps.toolchain.outputs.version }}
          arguments: --locked --all-features
          command: check

  build-candidate:
    name: Build candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Set up Docker to use mirror.gcr.io mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: build-candidate
      - name: Build ship binaries
        run: cargo build --locked --profile dist -p diorama -p dioramactl
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-binaries
          path: |
            target/dist/diorama
            target/dist/dioramactl
          if-no-files-found: error
          retention-days: 1
