name: Release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  # aarch64 and arm64 are the same Linux ELF. The arm runner builds it once and
  # the release is given both names.
  dist:
    name: Dist ${{ matrix.arch }}
    # Manual runs qualify the complete release without publishing or moving a tag.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - '127.0.0.1:5000:5000'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            bundle_arch: amd64
            addon_target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            bundle_arch: arm64
            addon_target: aarch64-unknown-linux-musl
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('v0.0.0-check.{0}', github.run_id) || github.ref_name }}
      BUNDLE_ARCH: ${{ matrix.bundle_arch }}
      BINARY_DIR: target/${{ matrix.target }}/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: dist-${{ matrix.arch }}
      - name: Install the release target
        run: rustup target add ${{ matrix.target }}
      - name: Build ship binaries
        run: cargo build --locked --profile dist -p diorama -p dioramactl --target ${{ matrix.target }}
      - name: Build static add-on installer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add ${{ matrix.addon_target }}
          CC=musl-gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            cargo build --locked --profile dist -p diorama-addon --target ${{ matrix.addon_target }}
      - name: Prepare pinned offline runtime and image assets
        run: |
          assets_dir="$RUNNER_TEMP/release-assets"
          printf 'ASSETS_DIR=%s\n' "$assets_dir" >> "$GITHUB_ENV"
          CARGO_PROFILE_DEV_CODEGEN_BACKEND=llvm cargo build --locked -p diorama-dev --bin diorama-release-bundle
          target/debug/diorama-release-bundle prepare "$BUNDLE_ARCH" "$assets_dir"
      - name: Build minimal storage and self-installing add-on images
        run: |
          target/debug/diorama-release-bundle build-images "$RELEASE_VERSION" "$BUNDLE_ARCH" \
            "target/${{ matrix.addon_target }}/dist/diorama-addon" "$ASSETS_DIR" docker localhost:5000
      - name: Build and export the offline diorama image
        run: |
          install -m 0755 "$BINARY_DIR/diorama" "$ASSETS_DIR/bin/diorama"
          install -m 0755 "$BINARY_DIR/dioramactl" "$ASSETS_DIR/bin/dioramactl"
          install -m 0755 container/entrypoint.sh "$ASSETS_DIR/entrypoint.sh"
          local_image="localhost:5000/diorama:$RELEASE_VERSION"
          docker build --platform "linux/$BUNDLE_ARCH" \
            --file container/Dockerfile.release --tag "$local_image" "$ASSETS_DIR"
          docker push "$local_image"
          "$ASSETS_DIR/tools/crane" mutate --insecure --platform "linux/$BUNDLE_ARCH" \
            --tag "ghcr.io/geoffsee/diorama:$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/diorama-image.tar" "$local_image"
          gzip -n -c "$RUNNER_TEMP/diorama-image.tar" > "$ASSETS_DIR/images/diorama.tar.gz"
      - name: Package and verify both core formats and add-on packs
        run: |
          for kind in host container portainer-agent d2k; do
            target/debug/diorama-release-bundle package "$kind" "$RELEASE_VERSION" "$BUNDLE_ARCH" \
              "$BINARY_DIR" "$ASSETS_DIR" dist
          done
          bundle="$PWD/dist/diorama-$RELEASE_VERSION-linux-$BUNDLE_ARCH-host-offline.tar.gz"
          installed="$RUNNER_TEMP/offline-install"
          sudo unshare --net "$BINARY_DIR/dioramactl" install \
            --offline-install="$bundle" --path="$installed"
          cmp "$BINARY_DIR/diorama" "$installed/bin/diorama"
          "$installed/bin/dioramactl" version
          test ! -e "$installed/images/diorama.tar.gz"
          test ! -e "$installed/images/portainer-agent.tar.gz"
          test ! -e "$installed/images/d2k.tar.gz"
          docker load --input "$ASSETS_DIR/images/diorama.tar.gz"
          docker run --rm --network=none --tmpfs /offline --entrypoint /bin/sh \
            "ghcr.io/geoffsee/diorama:$RELEASE_VERSION" -c '
              diorama-entrypoint --path=/offline/node --version &&
              test -x /offline/node/bin/containerd &&
              test -x /offline/node/bin/ctr &&
              test -x /offline/node/cni/bin/bridge &&
              command -v dioramactl &&
              for image in coredns pause local-path-provisioner busybox; do
                test -s "/offline/node/images/$image.tar.gz" || exit 1
              done'
      - name: Qualify offline Jobs, upgrades and persistent volumes
        run: |
          kubectl="$RUNNER_TEMP/kubectl"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://dl.k8s.io/release/v1.35.0/bin/linux/$BUNDLE_ARCH/kubectl" --output "$kubectl"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://dl.k8s.io/release/v1.35.0/bin/linux/$BUNDLE_ARCH/kubectl.sha256" --output "$kubectl.sha256"
          printf '%s  %s\n' "$(cat "$kubectl.sha256")" "$kubectl" | sha256sum --check --strict
          chmod +x "$kubectl"
          for mode in host container; do
            bash container/verify-offline.sh "ghcr.io/geoffsee/diorama:$RELEASE_VERSION" \
              "$PWD/dist" "$RELEASE_VERSION" "$BUNDLE_ARCH" "$BINARY_DIR/dioramactl" "$kubectl" "$mode"
          done
      - name: Package binaries
        run: |
          mkdir -p dist
          src="$BINARY_DIR"
          install -m 0755 "$src/diorama" "dist/diorama-linux-${{ matrix.arch }}"
          install -m 0755 "$src/dioramactl" "dist/dioramactl-linux-${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            install -m 0755 "$src/diorama" dist/diorama-linux-arm64
            install -m 0755 "$src/dioramactl" dist/dioramactl-linux-arm64
          else
            install -m 0755 "$src/diorama" dist/diorama-linux-amd64
            install -m 0755 "$src/dioramactl" dist/dioramactl-linux-amd64
          fi
          checksums="$RUNNER_TEMP/SHA256SUMS-${{ matrix.arch }}"
          (cd dist && sha256sum ./*) > "$checksums"
          (cd dist && sha256sum --check --strict "$checksums")
          mv "$checksums" dist/
      - name: Upload binaries and verified offline bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Attach GitHub release
    needs: dist
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download binaries and offline bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release
      - name: Combine checksums
        run: |
          cat release/SHA256SUMS-* | sort > release/SHA256SUMS
          rm release/SHA256SUMS-*
      - name: Publish the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          shopt -s failglob
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$tag" release/* --repo "$REPOSITORY" \
              --target "$GITHUB_SHA" --title "$tag" --verify-tag --generate-notes
          fi
