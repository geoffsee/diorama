name: Qodana
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: qodana (${{ matrix.linter }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - linter: qodana-rust
            # No 2026.1 release image exists. Root lets rustup install rust-toolchain.toml.
            image: jetbrains/qodana-rust:2026.1-eap
            extra-args: --user root
          - linter: qodana-go
            image: jetbrains/qodana-go:2026.1
            extra-args: ""
    steps:
      - name: Set up Docker to use mirror.gcr.io mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Qodana Scan
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        with:
          # Scan the whole tree. The default PR mode only inspects files changed in the pull request.
          pr-mode: false
          push-fixes: none
          args: --image ${{ matrix.image }} --within-docker true ${{ matrix.extra-args }}
          artifact-name: qodana-${{ matrix.linter }}
          primary-cache-key: qodana-${{ matrix.linter }}-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-${{ matrix.linter }}-${{ github.ref }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1008002786 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
