name: Security

on:
  push:
    branches: [main]
  pull_request:
    # Revalidate after a base change; stable required check names also survive metadata edits.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker to use mirror.gcr.io mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: security
      - name: Install locked CLI tools
        env:
          TOOL_DIRECTORY: ${{ runner.temp }}/diorama-security-tools
        run: |
          mkdir -p "$TOOL_DIRECTORY"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output "$TOOL_DIRECTORY/zizmor.tar.gz"
          printf '%s  %s\n' e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a \
            "$TOOL_DIRECTORY/zizmor.tar.gz" | sha256sum --check --strict
          tar -xzf "$TOOL_DIRECTORY/zizmor.tar.gz" -C "$TOOL_DIRECTORY" zizmor
          printf '%s\n' "$TOOL_DIRECTORY" >> "$GITHUB_PATH"
      - name: Run local security checks
        run: cargo run --locked -p diorama-dev --bin diorama-security
