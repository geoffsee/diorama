name: Set up pinned Rust
description: Install the repository toolchain and optionally restore a job-specific dependency cache.
inputs:
  cache-key:
    description: Separate compilation caches by job/profile; empty disables caching.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install rust-toolchain.toml
      shell: bash
      run: |
        rustup toolchain install --no-self-update
        rustc --version --verbose
    - name: Restore Rust dependencies
      if: inputs.cache-key != ''
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
