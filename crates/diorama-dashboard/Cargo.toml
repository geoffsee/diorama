[package]
name = "diorama-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
default = ["h3", "apiserver"]
h3 = ["dep:tokio-quiche", "dep:rcgen"]
apiserver = ["dep:diorama-apiserver", "dep:diorama-supervisor"]

[[bin]]
name = "diorama-dashboard"
path = "src/main.rs"

[dependencies]
bytes = "=1.12.1"
diorama-apiserver = { version = "=0.1.0", path = "../diorama-apiserver", optional = true }
diorama-supervisor = { version = "=0.1.0", path = "../diorama-supervisor", optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
http = "=1.5.0"
http-body-util = { version = "=0.1.5", features = ["channel"] }
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "http1"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
tokio-quiche = { version = "=0.20.1", default-features = false, optional = true }

[dev-dependencies]
diorama-datastore = { version = "=0.1.0", path = "../diorama-datastore" }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["test-util", "rt-multi-thread"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
