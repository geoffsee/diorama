[package]
name = "diorama-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
async-trait = "=0.1.89"
http = "=1.5.0"
diorama-apiserver = { version = "=0.1.0", path = "../diorama-apiserver" }
diorama-network = { version = "=0.1.0", path = "../diorama-network" }
diorama-supervisor = { version = "=0.1.0", path = "../diorama-supervisor" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "time", "net", "io-util", "fs"] }
tracing = "=0.1.44"

[dev-dependencies]
diorama-datastore = { version = "=0.1.0", path = "../diorama-datastore" }
diorama-pki = { version = "=0.1.0", path = "../diorama-pki" }
tokio = { version = "=1.54.1", features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
