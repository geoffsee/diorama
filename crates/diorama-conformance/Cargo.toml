[package]
name = "diorama-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dev-dependencies]
futures = "=0.3.34"
http = "=1.5.0"
json-patch = "=4.2.0"
k8s-openapi = { version = "=0.28.0", features = ["v1_35"] }
kube = { version = "=4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "jsonpatch", "ws"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-saphyr = "=0.0.29"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
