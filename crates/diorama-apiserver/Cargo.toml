[package]
name = "diorama-apiserver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
async-trait = "=0.1.89"
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = { version = "=0.1.5", features = ["channel"] }
hyper = { version = "=1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "client", "http1"] }
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["v1_35"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
diorama-config = { version = "=0.1.0", path = "../diorama-config" }
diorama-datastore = { version = "=0.1.0", path = "../diorama-datastore" }
diorama-pki = { version = "=0.1.0", path = "../diorama-pki" }
diorama-platform = { version = "=0.1.0", path = "../diorama-platform" }
diorama-supervisor = { version = "=0.1.0", path = "../diorama-supervisor" }
rustls = { version = "=0.23.45", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["rt", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["tls12"] }
x509-parser = "=0.18.1"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "=1.53.1", features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
