[package]
name = "diorama-addon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "=1.0.151"
kube = { version = "=4.2.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "=0.28.0", features = ["v1_35"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "time"] }
