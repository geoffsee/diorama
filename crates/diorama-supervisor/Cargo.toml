[package]
name = "diorama-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
rustix = { version = "=1.1.5", features = ["process", "fs"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "time", "signal"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
