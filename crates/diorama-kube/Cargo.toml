[package]
name = "diorama"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
diorama-config = { version = "=0.1.0", path = "../diorama-config" }
diorama-network = { version = "=0.1.0", path = "../diorama-network" }
serde_json = "=1.0.151"
diorama-platform = { version = "=0.1.0", path = "../diorama-platform" }
diorama-supervisor = { version = "=0.1.0", path = "../diorama-supervisor" }
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "http1"] }
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal", "net", "io-util", "fs"] }

diorama-apiserver = { version = "=0.1.0", path = "../diorama-apiserver" }
diorama-containerd = { version = "=0.1.0", path = "../diorama-containerd" }
diorama-controller = { version = "=0.1.0", path = "../diorama-controller" }
diorama-cri = { version = "=0.1.0", path = "../diorama-cri" }
diorama-datastore = { version = "=0.1.0", path = "../diorama-datastore" }
diorama-dns = { version = "=0.1.0", path = "../diorama-dns" }
dioramalet = { version = "=0.1.0", path = "../diorama-kubelet" }
diorama-pki = { version = "=0.1.0", path = "../diorama-pki" }
diorama-portainer = { version = "=0.1.0", path = "../diorama-portainer" }
diorama-proxy = { version = "=0.1.0", path = "../diorama-proxy" }
diorama-storage = { version = "=0.1.0", path = "../diorama-storage" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "mount"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["test-util"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
