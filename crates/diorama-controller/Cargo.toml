[package]
name = "diorama-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
async-trait = "=0.1.89"
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "http1"] }
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["v1_35"] }
diorama-apiserver = { version = "=0.1.0", path = "../diorama-apiserver" }
diorama-config = { version = "=0.1.0", path = "../diorama-config" }
diorama-pki = { version = "=0.1.0", path = "../diorama-pki" }
diorama-supervisor = { version = "=0.1.0", path = "../diorama-supervisor" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["rt", "macros", "sync", "time", "net", "io-util", "fs"] }
tracing = "=0.1.44"

[dev-dependencies]
diorama-datastore = { version = "=0.1.0", path = "../diorama-datastore" }
tempfile = "3.8"
tokio = { version = "=1.53.1", features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
