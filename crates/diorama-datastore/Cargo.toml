[package]
name = "diorama-datastore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
bytes = "=1.12.1"
diorama-pki = { version = "=0.1.0", path = "../diorama-pki" }
diorama-supervisor = { version = "=0.1.0", path = "../diorama-supervisor" }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
rustix = { version = "=1.1.5", features = ["fs"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "time", "fs", "net", "io-util"] }
tokio-quiche = { version = "=0.20.1", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["tls12"] }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "=1.54.1", features = ["test-util", "rt-multi-thread"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
