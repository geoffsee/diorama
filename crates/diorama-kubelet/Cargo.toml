[package]
name = "dioramalet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
async-trait = "=0.1.89"
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["v1_35"] }
rustix = { version = "=1.1.5", features = ["fs"] }
diorama-apiserver = { version = "=0.1.0", path = "../diorama-apiserver" }
diorama-config = { version = "=0.1.0", path = "../diorama-config" }
diorama-cri = { version = "=0.1.0", path = "../diorama-cri" }
diorama-network = { version = "=0.1.0", path = "../diorama-network" }
diorama-pki = { version = "=0.1.0", path = "../diorama-pki" }
diorama-supervisor = { version = "=0.1.0", path = "../diorama-supervisor" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["rt", "macros", "sync", "time", "net", "io-util", "fs", "process"] }

[dev-dependencies]
diorama-datastore = { version = "=0.1.0", path = "../diorama-datastore" }
tempfile = "3.8"
tokio = { version = "=1.53.1", features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
