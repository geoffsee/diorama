[package]
name = "diorama-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
diorama-addon = { version = "=0.1.0", path = "../diorama-addon" }
diorama-assets = { version = "=0.1.0", path = "../diorama-assets" }
dioramactl = { version = "=0.1.0", path = "../dioramactl" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = { version = "=0.11.0", default-features = false }
serde_json = "=1.0.151"
syn = { version = "=3.0.6", features = ["full", "visit"] }
regex = "=1.13.1"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[dev-dependencies]
zstd = { version = "=0.14.3", default-features = false }
diorama-platform = { version = "=0.1.0", path = "../diorama-platform" }
