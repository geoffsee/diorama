[package]
name = "dioramactl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
shlex = "=2.0.1"
diorama-config = { version = "=0.1.0", path = "../diorama-config" }
diorama-platform = { version = "=0.1.0", path = "../diorama-platform" }
diorama-supervisor = { version = "=0.1.0", path = "../diorama-supervisor" }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["rt", "macros", "sync", "time", "signal"] }
diorama-assets = { version = "=0.1.0", path = "../diorama-assets" }
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
serde_json = "=1.0.151"

[[test]]
name = "suite"
path = "tests/suite.rs"
